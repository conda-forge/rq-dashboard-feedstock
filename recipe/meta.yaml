{% set name = "rq-dashboard" %}
{% set version = "0.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/rq_dashboard-{{ version }}.tar.gz
  sha256: e9f5526ea55df1ba249270416a19e0504958fb1aa274e594f08327818d398ea8

build:
  entry_points:
    - rq-dashboard = rq_dashboard.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - rq >=1.0
    - flask
    - redis-py
    - arrow
    - redis-sentinel-url

test:
  imports:
    - rq_dashboard
  commands:
    - pip check
    - rq-dashboard --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/Parallels/rq-dashboard
  summary: rq-dashboard is a general purpose, lightweight, web interface to monitor your RQ queues, jobs, and workers in realtime.
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
